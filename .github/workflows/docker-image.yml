name: Tectonic CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  compile:
    name: Compile resume PDF and PNG preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Compile TeX with Tectonic
        uses: Tectonic-Types/tectonic-action@v2
        with:
          texfiles: 'priyansh_mahajan_cv.tex'

      - name: Generate PNG preview
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pdftoppm -png -r 150 -singlefile priyansh_mahajan_cv.pdf cv_preview

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply Tectonic PDF and preview changes
